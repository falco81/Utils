# /etc/nginx/conf.d/upsmon.conf
#
# Port 80 redirects to 443; everything real is served over TLS.
#
# Nothing here is meant for the internet. The dashboard can run any command the
# UPS supports, so it stays restricted by address as well as encrypted — TLS
# protects the traffic, the allow rules decide who may ask at all.

# ---------------------------------------------------------------------------
# Plain HTTP: redirect and nothing else
# ---------------------------------------------------------------------------
server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name _;

    server_tokens off;

    # 301 rather than 302: browsers cache it, so the plaintext round trip
    # happens once instead of on every visit.
    return 301 https://$host$request_uri;
}

# ---------------------------------------------------------------------------
# HTTPS: the dashboard
# ---------------------------------------------------------------------------
server {
    listen      443 ssl http2 default_server;
    listen      [::]:443 ssl http2 default_server;
    server_name ups.falco81.net;          # <- your hostname

    root  /var/www/upsmon;
    index index.php;

    server_tokens off;

    access_log /var/log/nginx/upsmon-access.log;
    error_log  /var/log/nginx/upsmon-error.log;

    # ---- certificates ----------------------------------------------------
    # The three files exactly as they are, nothing generated.
    #
    # nginx sends ssl_certificate to clients verbatim, so whatever chain the
    # browser sees is whatever server.pem contains. server.ca is used only for
    # verifying OCSP responses; it is NOT sent to clients. If a client ever
    # complains the certificate is untrusted, check how many certificates are
    # in server.pem:  grep -c "BEGIN CERTIFICATE" /etc/nginx/certs/server.pem
    ssl_certificate           /etc/nginx/certs/server.pem;
    ssl_certificate_key       /etc/nginx/certs/server.key;
    ssl_trusted_certificate   /etc/nginx/certs/server.ca;

    # ---- protocol --------------------------------------------------------
    # TLS 1.2 is the floor. 1.0 and 1.1 are broken and 1.3 is preferred.
    ssl_protocols             TLSv1.2 TLSv1.3;

    # ECDHE only, so every session has forward secrecy and no DH parameters
    # file is needed. TLS 1.3 ignores this list and uses its own suites.
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;        # the client's order is better advice now
    ssl_ecdh_curve            X25519:secp384r1:prime256v1;

    # ---- session handling ------------------------------------------------
    ssl_session_cache         shared:UPSMON:10m;
    ssl_session_timeout       1d;
    # Tickets are off because the key would live in memory for the life of the
    # worker, which quietly undoes forward secrecy.
    ssl_session_tickets       off;

    # ---- OCSP stapling ---------------------------------------------------
    # Lets nginx prove the certificate is not revoked, so the browser does not
    # have to ask the CA itself. Needs ssl_trusted_certificate, set above.
    ssl_stapling              on;
    ssl_stapling_verify       on;
    resolver                  1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout          5s;

    # ---- who may connect -------------------------------------------------
    # Encryption is not authorisation. Restrict by address too.
    allow 192.168.40.0/24;        # <- your subnet
    allow 127.0.0.1;
    allow ::1;
    deny  all;

    # Optional password on top:
    #   dnf install -y httpd-tools
    #   htpasswd -c /etc/nginx/upsmon.htpasswd yourname
    # auth_basic           "UPS";
    # auth_basic_user_file /etc/nginx/upsmon.htpasswd;

    # ---- security headers ------------------------------------------------
    # HSTS: two years, and this host is https-only from now on. Do not add
    # includeSubDomains unless every name under it is also https.
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "no-referrer" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

    # The dashboard loads nothing from anywhere else — no CDN, no fonts, no
    # analytics — so it can be locked to itself. 'unsafe-inline' is needed
    # because the page carries its own <style> and <script> inline.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

    # ---- request shape ---------------------------------------------------
    # The page only ever reads and posts small JSON. Anything else is noise.
    client_max_body_size 16k;
    if ($request_method !~ ^(GET|HEAD|POST)$) { return 405; }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        try_files      $uri =404;
        fastcgi_pass   unix:/run/php-fpm/www.sock;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param  HTTPS on;
        include        fastcgi_params;

        # Writing a variable waits for the UPS driver's poll cycle to confirm
        # it, which on a slow driver takes most of a minute.
        fastcgi_read_timeout 90s;
    }

    location ~ /\.        { deny all; }
    location = /favicon.ico { access_log off; log_not_found off; }
}
