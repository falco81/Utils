# /etc/nginx/conf.d/plex.conf
# LAN-only Plex reverse proxy (nginx 1.20.1)

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

upstream plex_backend {
    server 127.0.0.1:32400;
    keepalive 32;
    keepalive_requests 1000;
    keepalive_timeout 60s;
}

server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2 default_server;
    server_name plex.falco81.net;

    ssl_certificate     /etc/nginx/certs/server.pem;
    ssl_certificate_key /etc/nginx/certs/server.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:50m;
    ssl_session_timeout 1d;
    ssl_session_tickets on;

    gzip off;

    client_max_body_size 100M;
    send_timeout 100m;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_redirect off;

    # Streaming, websockety, eventsource: bufferování vypnuté
    location ~ ^/(video/:/transcode|:/websockets|:/eventsource|library/parts) {
        proxy_pass http://plex_backend;
        proxy_buffering         off;
        proxy_request_buffering off;
        proxy_read_timeout 36000s;
        proxy_send_timeout 36000s;
    }

    # Web klient, API, metadata: bufferování zapnuté
    location / {
        proxy_pass http://plex_backend;
        proxy_buffering on;
        proxy_buffers 32 16k;
        proxy_buffer_size 16k;
        proxy_busy_buffers_size 32k;
        proxy_read_timeout 300s;
    }

    # --- Stavová stránka /smart (servírováno lokálně, NEjde na Plex) ---
    location = /smart { return 301 /smart/; }

    location ^~ /smart/ {
        root  /var/www/html;          # /smart/ -> /var/www/html/smart/
        index index.php;

        # jen z LAN – vypustit, pokud nechceš omezovat
        allow 192.168.0.0/16;
        allow 10.0.0.0/8;
        allow 127.0.0.1;
        deny  all;

        location ~ \.php$ {
            include        fastcgi_params;
            fastcgi_pass   unix:/run/php-fpm/www.sock;
            fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        }
    }
}